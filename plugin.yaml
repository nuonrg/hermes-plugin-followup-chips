name: followup-chips
label: Follow-up Chips
version: 1.0.2
author: nuonrg
homepage: https://github.com/nuonrg/hermes-plugin-followup-chips
description: >
  Clickable follow-up chips under Hermes Desktop chat replies. The agent ends a
  reply with a ::followups directive; each option renders as a chip and one click
  sends it as the next user turn. With multi="1" several chips can be ticked and
  sent as one message, and the bundled prompt rule makes the agent end a choice
  that way instead of asking "say the word and I'll...". With rec="1,3" the
  options a decision classifier prefers carry a Recommended tag and start out
  picked, and its followup_recommend tool can name more than one when several
  steps belong together, but never all of them, never two that are alternatives
  or contradict, and never a "none of these" option beside an action. Recommendations are optional: they need the separate nerve
  classifier plugin, and without it the chips work exactly the same and are simply
  never marked. An optional auto_offers
  hook converts an offer the model wrote in prose anyway into the same chips
  before the reply is stored. Hermes arc-border hover, the arc keeps running
  while the agent answers and rests on a checkmark when done. Per-block state
  persists across reloads; every new block starts blank.
tags: [desktop, ux, chat]
provides_tools: [followup_recommend]
provides_hooks: [transform_llm_output]
config_schema:
  auto_offers:
    type: bool
    default: false
    label: Turn a written offer into chips
    description: >
      When the agent ends a reply with an offer in prose ("say the word and I'll
      push it", "want me to run the tests?"), rewrite that closing paragraph into
      follow-up chips. Off by default: the bundled prompt rule already asks the
      agent to end a choice with the directive, and this covers the replies that
      ignore it.
  auto_recommend:
    type: bool
    default: true
    label: Ask the decision classifier which steps to pick
    description: >
      When a decision classifier plugin is loaded (nerve, or jev), the prompt rule
      also asks the agent to call followup_recommend before writing the chips, so
      the steps worth taking now arrive tagged and pre-picked. Costs one classifier
      call per reply that offers a choice, roughly 200 ms. Turn it off to leave
      every chip unmarked; the tool stays available if asked for.
