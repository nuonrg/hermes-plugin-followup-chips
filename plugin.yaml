name: followup-chips
label: Follow-up Chips
version: 1.0.10
author: nuonrg
homepage: https://github.com/nuonrg/hermes-plugin-followup-chips
description: >
  Clickable follow-up chips under Hermes Desktop chat replies. The agent calls
  followup_chips (or, without tool calling, ends the reply with a ::followups
  directive); each option renders as a chip and one click
  sends it as the next user turn. Two or more chips are ticked and sent as one
  message by default, and multi="0" sends on a single click, and the bundled prompt rule makes the agent end a choice
  that way instead of asking "say the word and I'll...". With rec="1,3" the
  options a decision classifier prefers carry a Recommended tag, keep the accent
  tint, and start out picked; its followup_recommend tool can name more than one
  when several steps belong together, but never all of them, never two that are
  alternatives or contradict, and never a "none of these" option beside an action.
  Recommendations are optional: they need the
  separate nerve classifier plugin, and without it the chips work exactly the same
  and are simply never marked. Every chip in a block shares one width, set
  by the longest option, so a row of short actions still reads as a column. An
  optional auto_offers hook converts an offer the model wrote in prose anyway into
  the same chips before the reply is stored. With send_as_steer on, a chip steers the
  live turn instead of queueing behind it. With carry_over on, a reply also shows
  the proposals earlier replies left unanswered, each labelled with how many replies
  back it was offered and an X to drop it, so a long queued session cannot bury them. Hermes arc-border hover, the arc
  keeps running while the agent answers and rests on a checkmark when done. Per-block
  state persists across reloads; every new block starts blank.
tags: [desktop, ux, chat]
provides_tools: [followup_chips, followup_recommend]
provides_hooks: [transform_llm_output]
config_schema:
  auto_offers:
    type: bool
    default: false
    label: Turn a written offer into chips
    description: >
      When the agent ends a reply with an offer in prose ("say the word and I'll
      push it", "want me to run the tests?"), rewrite that closing paragraph into
      follow-up chips. Off by default: the bundled prompt rule already asks the
      agent to end a choice with the directive, and this covers the replies that
      ignore it.
  auto_recommend:
    type: bool
    default: true
    label: Ask the decision classifier which steps to pick
    description: >
      When a decision classifier plugin is loaded (nerve, or jev), the prompt rule
      also asks the agent to call followup_recommend before writing the chips, so
      the steps worth taking now arrive tagged and pre-picked. Costs one classifier
      call per reply that offers a choice, roughly 200 ms. Turn it off to leave
      every chip unmarked; the tool stays available if asked for.
  accent_recommended:
    type: bool
    default: true
    label: Accent the recommended options
    description: >
      Recommended chips keep the accent border and tint even while they are not
      picked, so the suggested steps read as one group rather than a tag floating
      on a plain chip. The tint still follows the app theme, so it matches light and
      dark. Turn it off and every chip stays on the neutral surface until you pick
      it; the Recommended tag stays either way. This one reaches the chips by
      attribute (accent="0"), because renderer code cannot read plugin settings.
  send_as_steer:
    type: bool
    default: false
    label: Send chip results as a steer
    description: >
      A chip clicked while the agent is working joins the queue as the next turn,
      on or off. With this on, it also steers the live turn, so the text lands
      mid-request; a refused steer falls back to that queued turn. Off by default,
      because steering changes the answer in progress.
  carry_over:
    type: bool
    default: false
    label: Carry Over Old Proposals
    description: >
      A reply's chips are only reachable while they are on screen. In a long queued
      session the next reply buries them, and a proposal you never answered is gone.
      With this on, every reply also shows the proposals earlier replies left
      unanswered, each labelled with how many replies back it was offered, and each
      carries an X to drop it from the queue. Clicking the label scrolls back to the
      reply that made the proposal. Reply 1 offers three steps, reply 2 offers none but still shows those
      three, reply 3 offers two and shows five: its own two, then the three stale
      ones. Picking a chip or pressing its X retires it. Off by default, because it
      changes every reply: with it on the agent half also appends one empty
      ::followups block to replies that propose nothing, since that slot is the only
      place the chips can draw. Peeking at a chip you narrow down is the point; it
      never sends anything on its own, so nothing is answered for you.
